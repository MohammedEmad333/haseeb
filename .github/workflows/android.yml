name: بناء تطبيق أندرويد · Android APK / AAB

# Every push builds an installable debug APK. A tag (v1.2.3) additionally
# builds signed release APK + AAB artifacts when a keystore is configured in
# secrets, and attaches the signed release artifacts to a GitHub release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The release job needs to create a release and upload assets to it.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The APK is gated on the same checks as the web build. Shipping an
      # installable artifact built from code that fails its own tests is worse
      # than shipping nothing.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Copy web assets into the native project
        run: npx cap sync android

      # versionName tracks package.json; versionCode must increase on every
      # build Google Play would ever see, so it is derived from the run number.
      - name: Resolve and validate version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NAME="$PACKAGE_VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "::error::Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
              exit 1
            fi
            NAME="$TAG_VERSION"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building حسيب $NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Build debug APK
        working-directory: android
        env:
          HASEEB_VERSION_NAME: ${{ steps.version.outputs.name }}
          HASEEB_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon assembleDebug

      # A release build is only produced when a keystore is actually
      # configured; an unsigned release APK cannot be installed, so publishing
      # one would be a trap rather than a convenience.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are incomplete — building the debug APK only."
          fi

      - name: Require signing for tagged releases
        if: github.ref_type == 'tag' && steps.signing.outputs.available != 'true'
        run: |
          echo "::error::Tagged releases require all Android signing secrets."
          exit 1

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/haseeb.jks"

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          HASEEB_VERSION_NAME: ${{ steps.version.outputs.name }}
          HASEEB_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/haseeb.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Remove the keystore from the runner
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/haseeb.jks"

      - name: Name the artifacts
        id: rename
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/haseeb-${{ steps.version.outputs.name }}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               "artifacts/haseeb-${{ steps.version.outputs.name }}-release.apk"
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab \
               "artifacts/haseeb-${{ steps.version.outputs.name }}-release.aab"
          fi
          ls -lh artifacts

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: haseeb-android-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach signed Android artifacts to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FILES=(
            "artifacts/haseeb-${{ steps.version.outputs.name }}-release.apk"
            "artifacts/haseeb-${{ steps.version.outputs.name }}-release.aab"
          )
          for file in "${RELEASE_FILES[@]}"; do
            test -f "$file" || { echo "::error::Missing signed release artifact: $file"; exit 1; }
          done
          gh release create "${GITHUB_REF_NAME}" "${RELEASE_FILES[@]}" \
            --title "حسيب ${{ steps.version.outputs.name }}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "${RELEASE_FILES[@]}" --clobber

  # The native SQLite driver only exists inside a device WebView, so it cannot
  # be covered by the unit tests or by a headless browser. This job installs
  # the APK on a real emulator and runs the app's own database self-test
  # against whichever driver it actually opened — the only way to know the
  # native path works before the APK reaches a phone.
  device-test:
    name: Database self-test on an emulator
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # KVM is what makes an x86_64 emulator fast enough to be worth running
      # on every push; without it the job would take the better part of an hour.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the database self-test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/device-selftest.sh
